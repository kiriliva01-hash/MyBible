<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библия — Синодальный перевод</title>
    <meta name="description" content="Читайте Библию в синодальном переводе онлайн.">
    <meta property="og:title" content="Библия онлайн">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>✝</text></svg>">
    
    <style>
        :root {
            --text: #3b2f1e;
            --card: #fff9f0;
            --border: #c4a67a;
            --accent: #6b4226;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #e8d8be;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 90, 58, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(139, 90, 58, 0.08) 1px, transparent 1px),
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(180, 140, 100, 0.05) 20px, rgba(180, 140, 100, 0.05) 22px),
                linear-gradient(160deg, #efe4d1 0%, #e8d8be 30%, #f5ede0 60%, #efe4d1 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(255,249,240,0.95) 0%, rgba(255,245,235,0.95) 100%);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(107, 66, 38, 0.15);
            border: 1px solid rgba(196, 166, 122, 0.4);
        }

        h1 {
            text-align: center;
            color: #4a3020;
            margin-bottom: 10px;
            font-weight: normal;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #7a5c42;
            font-style: italic;
            margin-bottom: 25px;
        }

        .book-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
            justify-content: center;
        }

        .book-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: linear-gradient(180deg, #fff9f0 0%, #f5ede0 100%);
            color: var(--accent);
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
            box-shadow: 0 2px 4px rgba(107, 66, 38, 0.1);
        }

        .book-btn:hover {
            background: #f0e2d0;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .book-btn.active {
            background: linear-gradient(180deg, #6b4226 0%, #5a3520 100%);
            color: white;
            border-color: #5a3520;
            font-weight: bold;
        }

        .chapter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 15px 0;
            justify-content: center;
            padding: 15px;
            background: rgba(196, 166, 122, 0.1);
            border-radius: 10px;
        }

        .chapter-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chapter-btn:hover { 
            background: #ede0ce;
            transform: scale(1.1);
        }

        .chapter-btn.active {
            background: #6b4226;
            color: white;
            border-color: #5a3520;
            font-weight: bold;
        }

        .bible-text { margin-top: 20px; }

        .bible-text h2 {
            text-align: center;
            color: var(--accent);
            font-weight: normal;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px dotted var(--border);
        }

        .verse {
            margin: 5px 0;
            padding: 8px 12px;
            border-left: 2px solid transparent;
            transition: all 0.3s;
            text-align: justify;
            border-radius: 0 8px 8px 0;
        }

        .verse:hover {
            background: rgba(196, 166, 122, 0.08);
            border-left-color: var(--accent);
        }

        .verse-num {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.8rem;
            margin-right: 5px;
            vertical-align: super;
        }

        .search-box { 
            margin: 20px 0; 
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            font-size: 1rem;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: white;
            color: var(--text);
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(107, 66, 38, 0.2);
        }

        .search-box .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #b8a080;
            pointer-events: none;
        }

        .search-box input::placeholder {
            color: #b8a080;
            font-style: italic;
        }

        .search-hint {
            text-align: center;
            color: #9b8570;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9b8570;
            font-style: italic;
        }

        .error {
            color: #b0483a;
            text-align: center;
            padding: 40px;
        }

        mark { 
            background: #ffe3a3;
            padding: 0 3px;
            border-radius: 3px;
        }

        .search-result {
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result:hover {
            background: rgba(196, 166, 122, 0.15);
            border-left-color: var(--accent);
            padding-left: 16px;
        }

        .results-count {
            text-align: center;
            color: #7a5c42;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: #9b8570;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .book-btn { padding: 6px 12px; font-size: 0.8rem; }
            .chapter-btn { width: 30px; height: 30px; font-size: 0.75rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✝ Библия</h1>
        <p class="subtitle">Синодальный перевод на русском языке</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по Библии...">
            <span class="search-icon">🔍</span>
        </div>
        <div class="search-hint">Введите слово и нажмите Enter для поиска</div>

        <div class="book-list" id="bookList">
            <div class="loading">Загрузка книг...</div>
        </div>

        <div class="chapter-nav" id="chapterNav" style="display:none;"></div>

        <div class="bible-text" id="bibleText">
            <div class="loading">⏳ Загрузка Священного Писания...</div>
        </div>

        <footer>
            <p>Синодальный перевод · Общественное достояние</p>
        </footer>
    </div>

    <script>
        // Словарь русских названий
        const BOOKS_RUSSIAN = {
            'gn': { name: 'Бытие', abbrev: 'Быт' },
            'ex': { name: 'Исход', abbrev: 'Исх' },
            'lv': { name: 'Левит', abbrev: 'Лев' },
            'nm': { name: 'Числа', abbrev: 'Чис' },
            'dt': { name: 'Второзаконие', abbrev: 'Втор' },
            'js': { name: 'Иисус Навин', abbrev: 'Нав' },
            'jud': { name: 'Судей', abbrev: 'Суд' },
            'rt': { name: 'Руфь', abbrev: 'Руф' },
            '1sm': { name: '1 Царств', abbrev: '1Цар' },
            '2sm': { name: '2 Царств', abbrev: '2Цар' },
            '1ki': { name: '3 Царств', abbrev: '3Цар' },
            '1kgs': { name: '3 Царств', abbrev: '3Цар' },
            '2ki': { name: '4 Царств', abbrev: '4Цар' },
            '2kgs': { name: '4 Царств', abbrev: '4Цар' },
            '1ch': { name: '1 Паралипоменон', abbrev: '1Пар' },
            '2ch': { name: '2 Паралипоменон', abbrev: '2Пар' },
            'ez': { name: 'Ездра', abbrev: 'Езд' },
            'ezr': { name: 'Ездра', abbrev: 'Езд' },
            'ne': { name: 'Неемия', abbrev: 'Неем' },
            'et': { name: 'Есфирь', abbrev: 'Есф' },
            'job': { name: 'Иов', abbrev: 'Иов' },
            'ps': { name: 'Псалтирь', abbrev: 'Пс' },
            'pr': { name: 'Притчи', abbrev: 'Прит' },
            'prv': { name: 'Притчи', abbrev: 'Прит' },
            'ec': { name: 'Екклесиаст', abbrev: 'Еккл' },
            'so': { name: 'Песнь Песней', abbrev: 'Песн' },
            'is': { name: 'Исаия', abbrev: 'Ис' },
            'jr': { name: 'Иеремия', abbrev: 'Иер' },
            'lm': { name: 'Плач Иеремии', abbrev: 'Плач' },
            'ezk': { name: 'Иезекииль', abbrev: 'Иез' },
            'dn': { name: 'Даниил', abbrev: 'Дан' },
            'ho': { name: 'Осия', abbrev: 'Ос' },
            'jl': { name: 'Иоиль', abbrev: 'Иоил' },
            'am': { name: 'Амос', abbrev: 'Ам' },
            'ob': { name: 'Авдий', abbrev: 'Авд' },
            'jn': { name: 'Иона', abbrev: 'Ион' },
            'mi': { name: 'Михей', abbrev: 'Мих' },
            'na': { name: 'Наум', abbrev: 'Наум' },
            'hk': { name: 'Аввакум', abbrev: 'Авв' },
            'zp': { name: 'Софония', abbrev: 'Соф' },
            'hg': { name: 'Аггей', abbrev: 'Агг' },
            'zc': { name: 'Захария', abbrev: 'Зах' },
            'ml': { name: 'Малахия', abbrev: 'Мал' },
            'mt': { name: 'От Матфея', abbrev: 'Мф' },
            'mk': { name: 'От Марка', abbrev: 'Мк' },
            'lk': { name: 'От Луки', abbrev: 'Лк' },
            'jo': { name: 'От Иоанна', abbrev: 'Ин' },
            'act': { name: 'Деяния', abbrev: 'Деян' },
            'jm': { name: 'Иакова', abbrev: 'Иак' },
            '1pe': { name: '1 Петра', abbrev: '1Пет' },
            '2pe': { name: '2 Петра', abbrev: '2Пет' },
            '1jo': { name: '1 Иоанна', abbrev: '1Ин' },
            '2jo': { name: '2 Иоанна', abbrev: '2Ин' },
            '3jo': { name: '3 Иоанна', abbrev: '3Ин' },
            'jd': { name: 'Иуды', abbrev: 'Иуд' },
            'rm': { name: 'К Римлянам', abbrev: 'Рим' },
            '1co': { name: '1 Коринфянам', abbrev: '1Кор' },
            '2co': { name: '2 Коринфянам', abbrev: '2Кор' },
            'gl': { name: 'К Галатам', abbrev: 'Гал' },
            'ep': { name: 'К Ефесянам', abbrev: 'Еф' },
            'eph': { name: 'К Ефесянам', abbrev: 'Еф' },
            'ph': { name: 'К Филиппийцам', abbrev: 'Флп' },
            'cl': { name: 'К Колоссянам', abbrev: 'Кол' },
            '1ts': { name: '1 Фессалоникийцам', abbrev: '1Фес' },
            '2ts': { name: '2 Фессалоникийцам', abbrev: '2Фес' },
            '1tm': { name: '1 Тимофею', abbrev: '1Тим' },
            '2tm': { name: '2 Тимофею', abbrev: '2Тим' },
            'tt': { name: 'К Титу', abbrev: 'Тит' },
            'phm': { name: 'К Филимону', abbrev: 'Флм' },
            'hb': { name: 'К Евреям', abbrev: 'Евр' },
            're': { name: 'Откровение', abbrev: 'Откр' }
        };

        const NT_ABBREVS = ['mt','mk','lk','jo','act','jm','1pe','2pe','1jo','2jo','3jo','jd','rm','1co','2co','gl','ep','eph','ph','cl','1ts','2ts','1tm','2tm','tt','phm','hb','re'];

        let allBooks = [];
        let currentBooks = [];
        let currentTestament = 'nt';
        let currentBookIndex = 0;
        let currentChapter = 0;
        
        // ИНДЕКС ДЛЯ БЫСТРОГО ПОИСКА
        let searchIndex = null;

        // Функция для получения стихов из главы
        function getVersesFromChapter(chapterData) {
            if (!chapterData) return [];
            
            if (Array.isArray(chapterData)) {
                return chapterData.map((verse, index) => {
                    if (typeof verse === 'string') {
                        return { verse: index + 1, text: verse };
                    }
                    if (verse && typeof verse === 'object') {
                        return {
                            verse: verse.verse || verse.number || (index + 1),
                            text: verse.text || verse.content || ''
                        };
                    }
                    return null;
                }).filter(v => v && v.text);
            }
            
            if (typeof chapterData === 'object') {
                if (chapterData.verses && Array.isArray(chapterData.verses)) {
                    return chapterData.verses.map((verse, index) => {
                        if (typeof verse === 'string') return { verse: index + 1, text: verse };
                        if (verse && typeof verse === 'object') {
                            return {
                                verse: verse.verse || verse.number || (index + 1),
                                text: verse.text || verse.content || ''
                            };
                        }
                        return null;
                    }).filter(v => v && v.text);
                }
                
                const entries = Object.entries(chapterData);
                if (entries.length > 0) {
                    return entries
                        .filter(([key, value]) => typeof value === 'string' && value.trim())
                        .map(([key, value]) => ({ verse: key, text: value }));
                }
            }
            
            return [];
        }

        // СОЗДАНИЕ ПОИСКОВОГО ИНДЕКСА (один раз при загрузке)
        function buildSearchIndex() {
            console.log('🔨 Строим поисковый индекс...');
            searchIndex = [];
            
            allBooks.forEach((book, bookIndex) => {
                if (!book.chapters) return;
                
                book.chapters.forEach((chapter, chapterIndex) => {
                    const verses = getVersesFromChapter(chapter);
                    
                    verses.forEach((verse) => {
                        if (verse.text) {
                            searchIndex.push({
                                bookIndex: bookIndex,
                                bookName: book.russianName,
                                bookAbbrev: book.russianAbbrev,
                                chapterIndex: chapterIndex,
                                verseNum: verse.verse,
                                text: verse.text,
                                textLower: verse.text.toLowerCase()
                            });
                        }
                    });
                });
            });
            
            console.log('✅ Индекс построен. Всего стихов: ' + searchIndex.length);
        }

        // БЫСТРЫЙ ПОИСК
        function fastSearch(query) {
            if (!searchIndex) return [];
            
            const lowerQuery = query.toLowerCase();
            const results = [];
            
            // Поиск с ограничением в 200 результатов
            for (let i = 0; i < searchIndex.length; i++) {
                if (searchIndex[i].textLower.includes(lowerQuery)) {
                    results.push(searchIndex[i]);
                    
                    // Ограничиваем результаты для скорости
                    if (results.length >= 200) {
                        results.hasMore = true;
                        break;
                    }
                }
            }
            
            return results;
        }

        async function loadBible() {
            try {
                const url = 'https://raw.githubusercontent.com/thiagobodruk/bible/refs/heads/master/json/ru_synodal.json';
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Загружено книг:', data.length);
                
                allBooks = data.map(book => {
                    const russianInfo = BOOKS_RUSSIAN[book.abbrev] || { 
                        name: book.name, 
                        abbrev: book.abbrev.toUpperCase() 
                    };
                    return {
                        ...book,
                        russianName: russianInfo.name,
                        russianAbbrev: russianInfo.abbrev,
                        testament: NT_ABBREVS.includes(book.abbrev) ? 'nt' : 'ot'
                    };
                });
                
                // Строим индекс после загрузки
                setTimeout(() => {
                    buildSearchIndex();
                }, 100);
                
                filterBooks('nt');
                
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('bibleText').innerHTML = `
                    <div class="error">
                        ❌ Не удалось загрузить Библию<br>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }

        function filterBooks(testament) {
            currentTestament = testament;
            
            if (testament === 'all') {
                currentBooks = allBooks;
            } else {
                currentBooks = allBooks.filter(book => book.testament === testament);
            }
            
            renderBookButtons();
            
            if (currentBooks.length > 0) {
                selectBook(0);
            }
            
            document.getElementById('searchInput').value = '';
        }

        function renderBookButtons() {
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';
            
            const filterDiv = document.createElement('div');
            filterDiv.style.cssText = 'width:100%; text-align:center; margin-bottom:10px;';
            filterDiv.innerHTML = `
                <button class="book-btn testament-btn ${currentTestament === 'all' ? 'active' : ''}" data-testament="all" style="margin:3px;">📖 Вся Библия</button>
                <button class="book-btn testament-btn ${currentTestament === 'ot' ? 'active' : ''}" data-testament="ot" style="margin:3px;">📜 Ветхий Завет</button>
                <button class="book-btn testament-btn ${currentTestament === 'nt' ? 'active' : ''}" data-testament="nt" style="margin:3px;">✝ Новый Завет</button>
            `;
            bookList.appendChild(filterDiv);
            
            const booksDiv = document.createElement('div');
            booksDiv.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; justify-content:center;';
            
            currentBooks.forEach((book, index) => {
                const btn = document.createElement('button');
                btn.className = 'book-btn';
                btn.textContent = book.russianAbbrev;
                btn.title = book.russianName;
                btn.onclick = () => {
                    document.getElementById('searchInput').value = '';
                    selectBook(index);
                };
                booksDiv.appendChild(btn);
            });
            
            bookList.appendChild(booksDiv);
            
            document.querySelectorAll('.testament-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBooks(this.dataset.testament);
                });
            });
        }

        function selectBook(index) {
            currentBookIndex = index;
            currentChapter = 0;
            
            const bookButtons = document.querySelectorAll('#bookList .book-btn:not(.testament-btn)');
            bookButtons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            renderChapterButtons();
            
            const book = currentBooks[index];
            if (book.chapters && book.chapters.length > 0) {
                selectChapter(0);
            }
        }

        function renderChapterButtons() {
            const chapterNav = document.getElementById('chapterNav');
            const book = currentBooks[currentBookIndex];
            const chapters = book.chapters;
            
            if (!chapters || chapters.length === 0) {
                chapterNav.style.display = 'none';
                return;
            }
            
            chapterNav.style.display = 'flex';
            chapterNav.innerHTML = '';
            
            const maxChapters = Math.min(chapters.length, 150); // Ограничение для Ветхого Завета
            
            for (let i = 0; i < maxChapters; i++) {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = i + 1;
                btn.onclick = () => selectChapter(i);
                chapterNav.appendChild(btn);
            }
        }

        function selectChapter(index) {
            currentChapter = index;
            
            document.querySelectorAll('.chapter-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            renderVerses();
        }

        function renderVerses() {
            const book = currentBooks[currentBookIndex];
            const chapterData = book.chapters[currentChapter];
            const bibleText = document.getElementById('bibleText');
            
            const verses = getVersesFromChapter(chapterData);
            
            if (verses.length === 0) {
                bibleText.innerHTML = '<div class="error">❌ Не удалось загрузить текст главы</div>';
                return;
            }
            
            // Ограничиваем количество отображаемых стихов для производительности
            const maxVerses = 500;
            const displayVerses = verses.slice(0, maxVerses);
            
            let html = `<h2>${book.russianName} — Глава ${currentChapter + 1}</h2>`;
            
            displayVerses.forEach((verse) => {
                if (verse.text) {
                    html += `
                        <div class="verse">
                            <span class="verse-num">${verse.verse}</span>
                            ${escapeHtml(verse.text)}
                        </div>
                    `;
                }
            });
            
            if (verses.length > maxVerses) {
                html += `<p class="loading">Показано ${maxVerses} из ${verses.length} стихов</p>`;
            }
            
            bibleText.innerHTML = html;
            bibleText.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ПОИСК ПО НАЖАТИЮ ENTER (не на каждый символ!)
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                
                if (query === '') {
                    if (currentBooks.length > 0) renderVerses();
                    return;
                }
                
                if (query.length < 2) {
                    alert('Введите минимум 2 символа для поиска');
                    return;
                }
                
                performSearch(query);
            }
        });

        function performSearch(query) {
            const bibleText = document.getElementById('bibleText');
            
            bibleText.innerHTML = '<div class="loading">🔍 Поиск...</div>';
            
            // Используем setTimeout чтобы не блокировать интерфейс
            setTimeout(() => {
                const results = fastSearch(query);
                
                if (results.length === 0) {
                    bibleText.innerHTML = `
                        <div class="loading">
                            <p>🔍 По запросу "<strong>${escapeHtml(query)}</strong>" ничего не найдено</p>
                        </div>
                    `;
                    return;
                }
                
                // Показываем результаты
                let html = `<h2>🔍 Результаты поиска: "${escapeHtml(query)}"</h2>`;
                html += `<p class="results-count">Найдено: ${results.length} совпадений${results.hasMore ? ' (показаны первые 200)' : ''}</p>`;
                
                const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
                
                // Группируем по книгам (первые 100 результатов для скорости)
                const displayResults = results.slice(0, 100);
                
                let currentBook = '';
                
                displayResults.forEach((r) => {
                    if (r.bookName !== currentBook) {
                        currentBook = r.bookName;
                        html += `<h3 style="color:#6b4226; margin-top:20px; padding-bottom:5px; border-bottom:1px dotted #c4a67a;">
                            📖 ${currentBook}
                        </h3>`;
                    }
                    
                    const highlightedText = r.text.replace(regex, '<mark>$1</mark>');
                    
                    html += `
                        <div class="verse search-result" 
                             onclick="navigateToVerse(${r.bookIndex}, ${r.chapterIndex})"
                             title="Нажмите, чтобы перейти к главе ${r.chapterIndex + 1}">
                            <span class="verse-num">${r.bookAbbrev} ${r.chapterIndex + 1}:${r.verseNum}</span>
                            ${highlightedText}
                        </div>
                    `;
                });
                
                bibleText.innerHTML = html;
            }, 50); // Небольшая задержка для отзывчивости интерфейса
        }

        function navigateToVerse(bookIndex, chapterIndex) {
            document.getElementById('searchInput').value = '';
            selectBook(bookIndex);
            setTimeout(() => {
                selectChapter(chapterIndex);
                document.getElementById('bibleText').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 100);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Запуск
        loadBible();
    </script>
</body>
</html>
